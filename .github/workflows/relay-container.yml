name: Relay container

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: relay-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: linux/amd64 deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a real public commit, not GitHub's synthetic pull-request merge
          # commit, because the source-offer smoke resolves its immutable archive.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:container
      - run: npm run check:host-relay
      - run: bash -n ops/host-relay/bin/*.sh
      - run: docker compose --env-file ops/host-relay/relay.env.example --file ops/host-relay/compose.yaml config >/dev/null
      - run: |
          systemd-analyze timespan '2min'
          systemd-analyze timespan '15min'
          systemd-analyze calendar '*-*-* 00:15:00'
          systemd-analyze calendar '*-*-* 12:15:00'
          systemd-analyze calendar 'Sun *-*-* 03:30:00'

  host-profile-smoke:
    name: linux/amd64 host profile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNS_RELAY_SOURCE_DIR: ${{ github.workspace }}
      FNS_RELAY_IMAGE: fns-public-relay:host-smoke-${{ github.sha }}
      FNS_RELAY_PROBE_PORT: "18080"
      FNS_RELAY_DOMAIN: relay.example.com
      FNS_RELAY_RELAY_CONTAINER_NAME: fns-relay
      FNS_RELAY_EDGE_CONTAINER_NAME: fns-relay-edge
      FNS_RELAY_EDGE_HTTP_BIND: 0.0.0.0
      FNS_RELAY_EDGE_HTTP_PORT: "80"
      FNS_RELAY_EDGE_HTTPS_BIND: 0.0.0.0
      FNS_RELAY_EDGE_HTTPS_PORT: "443"
      FNS_RELAY_CANDIDATE_DIR: ${{ runner.temp }}/fns-relay-production/candidates
      FNS_RELAY_BLOB_DIR: ${{ runner.temp }}/fns-relay-production/blobs
      FNS_RELAY_CAPABILITY_DIR: ${{ runner.temp }}/fns-relay-production/capabilities
      FNS_RELAY_SECRETS_DIR: ${{ runner.temp }}/fns-relay-production/secrets
      FNS_RELAY_ARCHIVE_STAGING_DIR: ${{ runner.temp }}/fns-relay-production/archive-staging
      FNS_RELAY_VERIFIED_ARCHIVE_DIR: ${{ runner.temp }}/fns-relay-production/verified-archive
      FNS_RELAY_EVIDENCE_DIR: ${{ runner.temp }}/fns-relay-production/evidence
      FNS_RELAY_DRILL_ROOT: ${{ runner.temp }}/fns-relay-production/drills
      FNS_RELAY_TLS_DIR: ${{ runner.temp }}/fns-relay-production/tls
      FNS_RELAY_ACME_WEBROOT: ${{ runner.temp }}/fns-relay-production/acme
      FNS_RELAY_SMOKE_ROOT: ${{ runner.temp }}/fns-relay-host-smoke
      FNS_RELAY_SMOKE_CONFIRM: I_UNDERSTAND_THIS_IS_NONPRODUCTION
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve reviewed test image digests
        run: |
          docker pull node:22-bookworm-slim
          docker pull nginx:1.27-alpine
          echo "FNS_RELAY_NODE_IMAGE=$(docker image inspect node:22-bookworm-slim --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
          echo "FNS_RELAY_EDGE_IMAGE=$(docker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Build the immutable Relay image record
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -E bash ops/host-relay/bin/initialize-host.sh
          sudo -E bash ops/host-relay/bin/build-image.sh
      - name: Exercise the disposable Linux host profile
        run: sudo -E bash ops/host-relay/bin/target-host-smoke.sh
