name: Relay container

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: relay-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: linux/amd64 deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a real public commit, not GitHub's synthetic pull-request merge
          # commit, because the source-offer smoke resolves its immutable archive.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:container
